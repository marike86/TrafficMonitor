name: Build Check
on:
  push:
    branches:
      - 'ci/build-check'
      - 'feature/multimonitor-taskbar-host'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_x64:
    # windows-latest 当前镜像为 VS18/v170，未安装 MFC 组件（MSB8041: MFC libraries are required），
    # 故固定使用自带 MFC 的 windows-2022 镜像并显式指定 VS2022。
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Add msbuild (VS2022) to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vsversion: '2022'

    - name: Build full solution (Release|x64)
      run: msbuild TrafficMonitor.sln -p:configuration=Release -p:platform=x64 -p:platformToolset=v143

    - name: Build lite solution (Release (lite)|x64)
      run: msbuild TrafficMonitor_Lite.sln -p:configuration="Release (lite)" -p:platform=x64 -p:platformToolset=v143

    - name: Upload exe
      uses: actions/upload-artifact@v4
      with:
        name: TrafficMonitor-x64
        path: |
          Bin/x64/Release/TrafficMonitor.exe
          Bin/x64/Release/*.dll
